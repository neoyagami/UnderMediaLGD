# Select the pro-audio profile and give both GC570D capture inputs stable names.

monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "AVerMedia Live Gamer DUO"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  {
    matches = [
      {
        api.alsa.card.name = "AVerMedia Live Gamer DUO"
        api.alsa.pcm.stream = "capture"
        card.profile.device = "0"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 2 (Capture Only)"
        node.nick = "HDMI 2 (Capture Only)"
        session.suspend-timeout-seconds = 5
      }
    }
  }
  {
    matches = [
      {
        api.alsa.card.name = "AVerMedia Live Gamer DUO"
        api.alsa.pcm.stream = "capture"
        card.profile.device = "1"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 1 (Passthrough)"
        node.nick = "HDMI 1 (Passthrough)"
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
